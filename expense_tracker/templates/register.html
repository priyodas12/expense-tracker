{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Register</h2>
  <form method="post" action="{{ url_for('auth.register') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="username" placeholder="Username (3-30 characters)" pattern="[A-Za-z0-9_.\-]{3,30}" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password (at least 8 characters)" minlength="8" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
