{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Edit expense</h2>
  <form method="post" action="{{ url_for('expenses.edit', expense_id=expense['id']) }}" class="add-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="description" value="{{ expense['description'] }}" maxlength="200" required>
    <input name="amount" inputmode="decimal" value="{{ expense['amount_cents']|money }}" required>
    <input name="date" type="date" value="{{ expense['date'] }}" required>
    <select name="category" required>
      {% for c in categories %}
      <option value="{{ c }}" {% if c == expense['category'] %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <button type="submit">Save</button>
    <a href="{{ url_for('expenses.index') }}" class="button-secondary">Cancel</a>
  </form>
</section>
{% endblock %}
